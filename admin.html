<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin | PAM SI</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css?v=pam-ai-20261028-admin2" />
    <link rel="stylesheet" href="/src/admin.css?v=pam-ai-20261028-admin2" />
  </head>
  <body class="admin-glass">
    <div class="admin-scene" aria-hidden="true"></div>

    <form class="admin-login glass" id="admin-login">
      <span class="admin-brand-mark" aria-hidden="true">PAM</span>
      <h1>Admin</h1>
      <label for="admin-secret"><span>Admin secret</span>
        <input id="admin-secret" name="secret" type="password" autocomplete="current-password" required />
      </label>
      <button class="admin-btn admin-btn-primary" type="submit">Open</button>
      <p class="admin-status" id="admin-status" role="status"></p>
    </form>

    <div class="admin-app" id="admin-app" hidden>
      <nav class="admin-rail glass" id="admin-rail" aria-label="Admin sections"></nav>
      <main class="admin-window glass" id="admin-window">
        <header class="admin-window-bar">
          <div>
            <h1 id="admin-view-title">Overview</h1>
            <p id="admin-view-sub"></p>
          </div>
          <div class="admin-window-actions">
            <span class="admin-updated" id="admin-updated"></span>
            <button class="admin-btn" type="button" id="admin-refresh">Refresh</button>
          </div>
        </header>
        <div class="admin-view" id="admin-content" tabindex="-1"></div>
      </main>
    </div>
    <div class="admin-toast glass" id="admin-toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/admin.js?v=pam-ai-20261028-admin2"></script>
  </body>
</html>
